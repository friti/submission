# espresso     = 20 minutes
# microcentury = 1 hour
# longlunch    = 2 hours
# workday      = 8 hours
# tomorrow     = 1 day
# testmatch    = 3 days
# nextweek     = 1 week


Common:
  mode: FP
  name: perfnano_fp

  tasks:
    - TTbar_perfNano.root_140X_1510pre4_PU200
    - SingleNautrino_perfNano.root_140X_1510pre4_PU200

  version: 140X
  output_dir_base: /eos/cms/store/cmst3/group/l1tr/friti/l1tpf/ntuples/15_1_0_pre4/140X/baseline/
  ncpu: 1
  output_file_name: perfNano.root.root

Configuration:
  - mode: FP
    cmssw_config: ../FastPUPPI/NtupleProducer/python/runPerformanceNTuple.py

TTbar_perfNano.root_140X_1510pre4_PU200:
  input_directory: /eos/cms/store/cmst3/group/l1tr/FastPUPPI/14_2_X/fpinputs_140X/v0/TT_PU200/
  crab: False
  splitting_mode: FileBased
  splitting_granularity: 1
  inline_customize:
   - saveCands();
   - saveGenCands();
  job_flavor: espresso
  max_events: -1

SingleNautrino_perfNano.root_140X_1510pre4_PU200:
  input_directory: /eos/cms/store/cmst3/group/l1tr/FastPUPPI/14_2_X/fpinputs_140X/v0/SingleNeutrino_PU200/
  crab: False
  splitting_mode: FileBased
  splitting_granularity: 1
  inline_customize:
   - saveCands();
   - saveGenCands();
  job_flavor: espresso
  max_events: -1